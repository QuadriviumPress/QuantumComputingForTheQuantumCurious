version: 1
project:
  title: Quantum Computing for the Quantum Curious
  short_title: Quantum Computing
  description: >-
    An approachable introduction to quantum information and computation,
    including qubits, gates, cryptography, entanglement, teleportation, and
    quantum algorithms.
  keywords:
    - quantum computing
    - quantum information
    - qubits
    - quantum algorithms
    - open textbook
  authors:
    - name: Ciaran Hughes
    - name: Joshua Isaacson
    - name: Anastasia Perry
    - name: Ranbel F. Sun
    - name: Jessica Turner
  date: 2021-01-01
  doi: 10.1007/978-3-030-61601-4
  license: CC-BY-4.0
  open_access: true
  github: QuadriviumPress/quantumComputingForTheQuantumCurious
  error_rules:
    # Remote hosts often answer 403, 404, or 5xx to the CI checker even when the
    # page is fine in a browser. Internal links and missing files still fail.
    - rule: link-resolves
      severity: ignore
      keys:
        - "{http,https}://**"
    - rule: doi-link-valid
      severity: ignore
  toc:
    - file: index.md
    - file: chapters/ch-01-introduction-to-superposition.md
    - file: chapters/ch-02-what-is-a-qubit.md
    - file: chapters/ch-03-creating-superposition-the-beam-splitter.md
    - file: chapters/ch-04-creating-superposition-stern-gerlach.md
    - file: chapters/ch-05-quantum-cryptography.md
    - file: chapters/ch-06-quantum-gates.md
    - file: chapters/ch-07-entanglement.md
    - file: chapters/ch-08-quantum-teleportation.md
    - file: chapters/ch-09-quantum-algorithms.md
    - file: chapters/ch-10-worksheets.md
  exports:
    - id: book-pdf
      format: pdf
      template: ./templates/book
      output: exports/quantum-computing-for-the-quantum-curious.pdf
      articles:
        - file: chapters/ch-01-introduction-to-superposition.md
          level: 0
        - file: chapters/ch-02-what-is-a-qubit.md
          level: 0
        - file: chapters/ch-03-creating-superposition-the-beam-splitter.md
          level: 0
        - file: chapters/ch-04-creating-superposition-stern-gerlach.md
          level: 0
        - file: chapters/ch-05-quantum-cryptography.md
          level: 0
        - file: chapters/ch-06-quantum-gates.md
          level: 0
        - file: chapters/ch-07-entanglement.md
          level: 0
        - file: chapters/ch-08-quantum-teleportation.md
          level: 0
        - file: chapters/ch-09-quantum-algorithms.md
          level: 0
        - file: chapters/ch-10-worksheets.md
          level: 0
site:
  template: book-theme
  title: Quantum Computing for the Quantum Curious
  options:
    favicon: images/favicon.svg
    logo: images/logo.svg
    logo_dark: images/logo-dark.svg
    logo_alt: Quantum circuit wire with a Hadamard gate
    logo_text: Quantum Computing
    logo_url: /
  actions:
    - title: Springer Open Access Book
      url: https://link.springer.com/book/10.1007/978-3-030-61601-4
  nav:
    - title: Sources & Attribution
      url: https://github.com/QuadriviumPress/quantumComputingForTheQuantumCurious/blob/main/SOURCES.md
